<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soft pop">
  
  <defs>
    <linearGradient id="g-vsp" gradientTransform="rotate(90 .5 .5)">
      <stop offset="0%" stop-color="#fff3f8"/><stop offset="100%" stop-color="#ffe6d6"/>
    </linearGradient>
    <filter id="grain-vsp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="480" height="320" fill="url(#g-vsp)"/>
  <circle cx="150" cy="130" r="80" fill="#ff8fb1"/>
  <circle cx="300" cy="200" r="64" fill="#ffd166"/>
  <circle cx="360" cy="110" r="40" fill="#6fd6c4"/>
  <rect width="480" height="320" filter="url(#grain-vsp)" opacity="0.5"/>
</svg>
